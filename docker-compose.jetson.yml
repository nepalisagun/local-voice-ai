# JetPack 6.2 / L4T 36.4.x overlay for Jetson Orin.
# `python3 run.py` selects this file automatically on supported Jetson devices.
services:
  app:
    build:
      dockerfile: Dockerfile.jetson
      args:
        JETSON_PYTORCH_IMAGE: ${JETSON_PYTORCH_IMAGE:-docker.io/dustynv/pytorch:2.7-r36.4.0-cu128-24.04@sha256:4bb7f0a3852f86629ed271aaf6c4aa000305cc4e4673b8e9f334668ee1b22bc8}
        LIVEKIT_IMAGE: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-b3c3b96a139d4ef1bdec926ac17aa040981cfc5d}
    runtime: nvidia
    shm_size: "1gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-999}
      DEVICE: ${DEVICE:-cuda}
